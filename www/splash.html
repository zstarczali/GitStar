<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <title>GitStar</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; user-select: none; cursor: default; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: #e9e6ff;
      background: radial-gradient(120% 90% at 50% 38%, #2a1b5e 0%, #140d33 45%, #08061a 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      border: 1px solid rgba(255, 255, 255, 0.08); box-sizing: border-box;
    }
    /* soft moving aurora behind everything */
    body::before {
      content: ''; position: fixed; inset: -40%;
      background: conic-gradient(from 0deg, rgba(34, 211, 238, 0.10), rgba(168, 85, 247, 0.16), rgba(236, 72, 153, 0.10), rgba(245, 158, 11, 0.08), rgba(34, 211, 238, 0.10));
      filter: blur(40px); animation: spin 14s linear infinite; z-index: -1;
    }
    .logo { position: relative; width: 104px; height: 104px; margin-bottom: 8px; }
    .logo::before {
      content: ''; position: absolute; inset: -22px; border-radius: 50%;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.55), rgba(34, 211, 238, 0.15) 55%, transparent 72%);
      animation: pulse 2.4s ease-in-out infinite;
    }
    .logo img { position: relative; width: 100%; height: 100%; filter: drop-shadow(0 10px 22px rgba(124, 58, 237, 0.5)); animation: pop 0.7s cubic-bezier(.2, 1.4, .4, 1) both, float 5s ease-in-out 0.7s infinite; }
    .name {
      font-size: 34px; font-weight: 800; letter-spacing: 0.5px;
      background: linear-gradient(90deg, #22d3ee, #818cf8 35%, #d946ef 65%, #f59e0b);
      background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: fade 0.6s 0.15s both, sheen 4s linear infinite;
    }
    .tag { font-size: 12.5px; color: #b9b3e6; animation: fade 0.6s 0.3s both; }
    .bar { width: 220px; height: 3px; margin-top: 18px; border-radius: 3px; background: rgba(255, 255, 255, 0.08); overflow: hidden; animation: fade 0.6s 0.45s both; }
    .bar i { display: block; width: 40%; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #22d3ee, #a855f7, #ec4899); animation: slide 1.3s ease-in-out infinite; }
    .status { font-size: 11px; color: #8f88c4; margin-top: 4px; min-height: 14px; animation: fade 0.6s 0.45s both; }
    .foot { position: fixed; bottom: 10px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 14px; font-size: 10.5px; color: #6f68a3; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 0.65; transform: scale(0.94); } 50% { opacity: 1; transform: scale(1.06); } }
    @keyframes pop { from { opacity: 0; transform: scale(0.6) rotate(-12deg); } to { opacity: 1; transform: none; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes sheen { to { background-position: -200% 0; } }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { *, *::before { animation-duration: 0.01s !important; animation-iteration-count: 1 !important; } }
  </style>
  <script type="module" src="js/splash.js"></script>
</head>
<body>
  <div class="logo"><img src="img/icon.svg" alt="" /></div>
  <div class="name">GitStar</div>
  <div class="tag" id="tag">Git kliens AI commit üzenetekkel és vizuális diff-fel</div>
  <div class="bar"><i></i></div>
  <div class="status" id="status">Betöltés…</div>
  <div class="foot"><span id="ver"></span><span>© 2026 Zsolt Tarczali</span></div>
</body>
</html>
